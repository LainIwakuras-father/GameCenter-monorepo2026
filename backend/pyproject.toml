[project]
name = "gamecenter-fastapi"
version = "1.0.0"
description = "gamecenter for SpbSUT meetup"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aerich>=0.9.1",
    "aiofiles>=24.1.0",
    "asyncpg>=0.30.0",
    "bcrypt==4.0.1",
    "fastadmin[fastapi,tortoise-orm]>=0.2.22",
    "fastapi>=0.141.1,<1.0",
    "gunicorn>=23.0.0",
    "loguru>=0.7.3",
    "passlib==1.7.4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "starlette>=1.3.1,<2.0",
    "tortoise-orm[asyncpg]>=0.25.1,<1.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.13.0",
]
system = [
    "setuptools>=80.9.0",
]



[tool.aerich]

tortoise_orm = "app.db.DB_CONFIG"

location = "./migrations"

src_folder = "./."

[tool.ruff]
# Set the maximum line length to 79.
line-length = 79

[tool.ruff.lint]
extend-select = ["E501"]
ignore = ["N999"]

[tool.ruff.lint.per-file-ignores]
# Seed descriptions are intentionally kept as readable multiline content.
"app/create_stations.py" = ["E501"]
"app/create_tasks.py" = ["E501"]
