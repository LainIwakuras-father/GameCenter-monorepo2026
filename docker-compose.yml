services:
  db:
    image: postgres:15
    container_name: db-post_gamecenter
    hostname: postgres
    ports:
      - "5432:5432"
    env_file:
      - .env.backend.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gamecenter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gamecenter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - network

  web:
    container_name: app_gamecenter
    build: ./backend
    hostname: web
    command:
      - /bin/sh
      - -c
      - >-
        uv run aerich upgrade &&
        exec uv run gunicorn -w 5 -k uvicorn.workers.UvicornWorker
        -b 0.0.0.0:8000 app.main:app
    env_file:
      - .env.backend.prod
    environment:
      DB_ENGINE: tortoise.backends.asyncpg
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-gamecenter}
      DB_USER: ${POSTGRES_USER:-gamecenter}
      DB_PASS: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?set ADMIN_SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-1}
      ADMIN_USER_MODEL: ${ADMIN_USER_MODEL:-User}
      ADMIN_USER_MODEL_USERNAME_FIELD: ${ADMIN_USER_MODEL_USERNAME_FIELD:-username}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/static:/backend/static
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - network

  frontend:
    build:
      context: ./gamecenter_frontend-main
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    hostname: frontend
    env_file:
      - .env.frontend.prod
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - network


  nginx:
    image: nginx:1.27-alpine
    hostname: nginx-entrypoint
    container_name: nginx-entrypoint
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      web:
        condition: service_healthy
    environment:
      TZ: "Europe/Moscow"
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - network
  certbot:
    image: certbot/certbot:latest
    container_name: certbot_gamecenter
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    #command: certonly --webroot -w /var/www/certbot --force-renewal --email ваша_почта --agree-tos -d ваш_домен
    networks:
      - network

networks:
  network:
    name: network
    driver: bridge


volumes:
  postgres_data:
